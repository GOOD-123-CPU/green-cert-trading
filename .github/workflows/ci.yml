name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven (skip tests)
        working-directory: 系统/销售系统/源码/springboot
        run: mvn -B package -DskipTests

      - name: Run unit tests
        working-directory: 系统/销售系统/源码/springboot
        run: mvn -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: 系统/销售系统/源码/springboot/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend Lint & Build (Vue 3 + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 系统/销售系统/源码/vue3/package-lock.json

      - name: Install dependencies
        working-directory: 系统/销售系统/源码/vue3
        run: npm ci

      - name: Lint
        working-directory: 系统/销售系统/源码/vue3
        run: npm run lint

      - name: Build
        working-directory: 系统/销售系统/源码/vue3
        run: npm run build
