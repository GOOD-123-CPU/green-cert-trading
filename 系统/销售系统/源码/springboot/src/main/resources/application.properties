# =====================================================================
# Green Certificate Trading Platform - Backend Configuration (Template)
# =====================================================================
# SECURITY NOTICE:
#   Never commit real credentials to version control.
#   All secrets are injected via environment variables (recommended),
#   e.g. spring.datasource.password -> SPRING_DATASOURCE_PASSWORD
# =====================================================================

spring.application.name=green-cert-backend

# ---- Server ----
server.port=1234
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ---- DataSource (override via env: SPRING_DATASOURCE_URL / USERNAME / PASSWORD) ----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:db_aps}?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- MyBatis / MyBatis-Plus ----
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-built-in-alias-types=true
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_empty

# ---- App-specific (override via env: APP_DEFAULT_PASSWORD / APP_FROM_EMAIL) ----
user.defaultPassword=${APP_DEFAULT_PASSWORD:GreenCert@2026}
user.fromEmail=${APP_FROM_EMAIL:demo@example.com}

# ---- JWT secret (override via env: APP_JWT_SECRET). CHANGE THIS IN PRODUCTION! ----
app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-long-random-string-openssl-rand-hex-32}

# ---- RSA login-transport keys (override via env: APP_RSA_PRIVATE_KEY / APP_RSA_PUBLIC_KEY) ----
# Leave empty to auto-generate on startup (dev only, single instance)
app.security.rsa-private-key=${APP_RSA_PRIVATE_KEY:}
app.security.rsa-public-key=${APP_RSA_PUBLIC_KEY:}

# ---- Mail (override via env: MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD) ----
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:demo@example.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=utf-8
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# ---- File upload ----
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Cache ----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ---- Static resources ----
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

# ---- Actuator（仅暴露健康检查，无敏感信息） ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- SpringDoc OpenAPI ----
# 生产环境设 SPRINGDOC_API_DOCS_ENABLED=false 关闭文档
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---- Logging（traceId 由 ApiLoggingAspect 写入 MDC） ----
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] %m%n
logging.level.org.example.springboot=INFO
logging.level.org.springframework.web=INFO
