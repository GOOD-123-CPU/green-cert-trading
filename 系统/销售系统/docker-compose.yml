services:
  mysql:
    image: mysql:8.4
    container_name: greencert-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-greencert123}
      MYSQL_DATABASE: db_aps
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./数据库/db_aps_绿证版.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./源码
      dockerfile: Dockerfile
    container_name: greencert-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: db_aps
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-greencert123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-please-change-this-secret-in-production}
      APP_FROM_EMAIL: ${APP_FROM_EMAIL:-demo@example.com}
      MAIL_USERNAME: ${MAIL_USERNAME:-demo@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "1234:1234"

  frontend:
    image: nginx:1.27-alpine
    container_name: greencert-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./源码/vue3/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
